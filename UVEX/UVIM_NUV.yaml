object: instrument
alias: INST
name: NUV
description: base configuration for UVIM NUV imaging plane

properties:
  pixel_scale: 1.03  # arcsec / pixel
  plate_scale: 103   # arcsec / mm

effects:
  - name: nuv_surfaces
    description: surfaces list for NUV imaging, including the filter and dichroic transmission
    class: SurfaceList
    kwargs:
      filename: LIST_surfaces_NUV.tbl

  - name: psf
    class: SeeingPSF
    kwargs:
      fwhm: 2
      fwhm_unit: arcsec

  - name: qe_curve
    description: Quantum efficiency curve for the NUV detector
    class: QuantumEfficiencyCurve
    kwargs:
        filename: data_files/UVIM_NUV_QE.dat

# NUV simulation parameters
---
object: simulation
alias: SIM
name: NUV_simulation_parameters
description: simulation parameters for UVEX NUV imaging run

properties:
  computing:
      oversampling_x: 2
      oversampling_y: 2
      psf_oversampling: 10 # however much the input psfs are oversampled: don't change!
      flux_accuracy: 1e-4