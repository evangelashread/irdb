object: detector
alias: DET
name: uvex_lss_detector
description: Two adjacent 4096x4096 CMOS detectors for LSS mode

properties:
  detector: UVEX_CMOS_LSS
  image_plane_id: 0
  dit: "!OBS.dit"
  ndit: "!OBS.ndit"
  gain: 1.2

effects:
  - name: LSS_Detector
    class: DetectorList
    include: True
    kwargs:
      array_dict:
        id: [1, 2]
        pixsize: [0.01, 0.01] # 10 microns / pix
        angle: [0., 0.]
        gain: [1.2, 1.2]
        x_cen: [0., 0.]
        y_cen: [36.086, -5.874] # two detectors oriented along the spectral direction
        x_size: [40.96, 40.96]
        y_size: [40.96, 40.96]
      x_cen_unit: mm
      y_cen_unit: mm
      x_size_unit: mm
      y_size_unit: mm
      pixsize_unit: mm
      angle_unit: deg
      gain_unit: electron/adu
      
#  - name: bias
#    description: Constant electronic bias offset added to the readout
#    class: Bias
#    kwargs:
#      value: 0

  - name: lss_dark_current
    description: CMOS detector dark current
    class: DarkCurrent
    # [e-/s] level of dark current for each detector
    kwargs:
      value: 0.001

  - name: lss_detector_linearity
    description: Detector linearity and saturation characteristics
    class: LinearityCurve
    include: False
    kwargs:
      filename: tbd_det_linearity.dat

  - name: lss_shot_noise
    description: apply poisson shot noise to images
    class: ShotNoise

  - name: lss_readout_noise
    description: Readout noise frames
    class: BasicReadoutNoise
    kwargs:
      noise_std: 2.0 # e-

  - name: lss_inter_pixel_capacitance
    description: Inter-pixel capacitance (IPC) convolution kernel
    class: InterPixelCapacitance
    include: False
    kwargs:
      filename: tbd_ipc_kernel.fits
      
  - name: lss_ad_conversion
    description: Apply gain and convert electron count into integers
    class: ADConversion
    kwargs:
       dtype: uint16
       gain:
           1:  "!DET.gain"
           2:  "!DET.gain"
